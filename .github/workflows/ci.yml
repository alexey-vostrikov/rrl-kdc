name: ci

# Everything compiles inside `rust:1.99.1-bookworm`, the same image a developer
# runs locally: the toolchain is the image tag, not a `rustup` download, so what
# CI builds with is what the repository says it builds with. `act push` runs
# this file as it is, which is the point — a workflow that only works on GitHub
# is a workflow nobody has run.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rust:1.99.1-bookworm
    env:
      CARGO_TERM_COLOR: always
      # The image ships exactly the channel `rust-toolchain.toml` names; these
      # point at its own toolchain rather than at a home directory that does not
      # exist in a fresh container.
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /usr/local/cargo
    steps:
      - uses: actions/checkout@v4

      # `act` replaces PATH when it runs a step (its own node goes first), so the
      # image's PATH is published for the later steps explicitly. On GitHub the
      # image already has it and the duplicate entry is harmless.
      - name: Publish the toolchain on PATH
        run: echo "/usr/local/cargo/bin" >> "$GITHUB_PATH"

      # The pin lives in `rust-toolchain.toml`; the image tag has to agree with
      # it. A mismatch is a gate failure, not a warning: building with a
      # different compiler than the one the repository declares is how a
      # `cargo fmt --check` goes red for a reason nobody can reproduce locally.
      - name: The toolchain matches rust-toolchain.toml
        run: |
          declared=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          echo "declared=$declared actual=$actual"
          test "$declared" = "$actual"

      - name: rustfmt
        run: cargo fmt --all --check

      # `-D warnings` rather than a tail of output: a warning nobody reads is a
      # warning that becomes a defect, and this crate is small enough that
      # holding the line costs nothing.
      # Every feature, because a feature that only compiles when somebody
      # remembers to ask for it is a feature that stops compiling unnoticed. The
      # backends (redb) and the cross-check (rskrb5) are both in here.
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The primary configuration: no optional backend and no second crypto
      # implementation. This is what a consumer gets by default, so it is what
      # the gate must prove first.
      - name: test
        run: cargo test

      # Everything on: the redb backend, the change-password service, and the
      # cross-check against `rskrb5`'s crypto.
      - name: test with every feature
        run: cargo test --all-features
