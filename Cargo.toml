[package]
name = "rrl-kdc"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Kerberos KDC core in Rust: sans-io AS/TGS, HDB, RFC 3961/3962/8009 crypto, PAC, FAST and PKINIT"
license = "MIT"
repository = "https://github.com/alexey-vostrikov/rrl-kdc"
readme = "README.md"
keywords = ["kerberos", "kdc", "krb5", "rfc4120", "authentication"]
categories = ["authentication", "cryptography", "network-programming"]

[dependencies]
# The Kerberos crypto: RFC 3961/3962/8009 profile, in its own crate so that the client side shares
# one implementation instead of keeping a second copy that could disagree. It brings `aes`, `hmac`,
# `sha1`, `sha2`, `md-5` and `getrandom` with it; nothing else of ours needs them directly.
# A git dependency rather than a path one: CI and any other clone of this repository do not have a
# sibling checkout, and a path that resolves to nothing reads as "no matching package found". With
# the branch named, `Cargo.lock` pins the exact revision, so a build is reproducible while the two
# crates can still move together — after a change in `rrl-crypto`, `cargo update -p rrl-crypto`.
rrl-crypto = { git = "https://github.com/alexey-vostrikov/rrl-crypto", branch = "main" }
# The DER layer and the RFC 4120 structures, shared with the acceptor that parses what this KDC
# produces. One decoder for the octets a checksum covers is the point: a second copy is a second
# way to disagree with a peer about a ticket that is otherwise valid.
rrl-krb-common = { git = "https://github.com/alexey-vostrikov/rrl-krb-common", branch = "main" }
sha1 = "0.11"
sha2 = "0.11"
# The S4U checksum's construction moved to `rrl-crypto`, so this is left for the PAC tests that
# verify a signature independently.
hmac = "0.13"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

tracing = { version = "0.1", optional = true }
redb = { version = "4.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
base64 = { version = "0.22", optional = true }

# The secondary implementation, kept only for the differential check. Its crypto
# is the only half used, so the client-oriented features stay off: no tokio, no
# resolver, no SPNEGO.
rskrb5 = { version = "0.2", default-features = false, optional = true }

# PKINIT. `x509-parser` reads the certificate and its `id-pkinit-san` otherName;
# `rsa` verifies the CMS signature and, in the key-transport mode, encrypts the
# reply. The MODP groups of RFC 3526 need arithmetic wider than the language has,
# hence `num-bigint`.
x509-parser = { version = "0.18", default-features = false, optional = true }
rsa = { version = "0.9", optional = true }
# AES-256-CBC for the content of a transported PKINIT reply key (RFC 4556 §3.2.3.2). Only the
# block cipher: the CBC and PKCS #7 layers are twenty lines in `kdc::pkinit::reply`, and a mode
# crate for one call site would be a dependency nobody reviews.
aes = { version = "0.9", optional = true }
# Elliptic-curve Diffie-Hellman for PKINIT (RFC 5349). Three crates because each curve is its own
# crate, the same three the client (`rrl-krb5`) uses — one implementation of each curve between the
# two sides of an exchange is the property that makes an interop test mean anything.
p256 = { version = "0.14", optional = true, default-features = false, features = ["ecdh"] }
p384 = { version = "0.14", optional = true, default-features = false, features = ["ecdh"] }
p521 = { version = "0.14", optional = true, default-features = false, features = ["ecdh"] }
num-bigint = { version = "0.4", default-features = false, optional = true }
# The curve arithmetic for SPAKE (RFC 9588). Not a Kerberos profile: unlike RFC 3961, where
# this crate owns every octet, edwards25519 multiplication fails subtly rather than loudly when
# written by hand. The protocol around it — w, the transcript, K'[n] — is ours and is checked
# against the published vectors.
curve25519-dalek = { version = "4", optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
# `rsa` 0.9 is built on `digest` 0.10 while this crate uses `sha2` 0.11, and the
# two do not interop: `Pkcs1v15Sign::new::<D>()` needs the `Digest` the signature
# crate knows. Rather than downgrade the crate's own SHA-2, the verification path
# brings its own copy under a name that says why it exists.
rsa-sha2 = { package = "sha2", version = "0.10", features = ["oid"], optional = true }

[features]
default = []
# Heimdal writes its audit log through the host's syslog; here it is `tracing`.
trace = ["dep:tracing"]
# The second HDB backend: a single-file redb store, the same version the
# in-process consumer already builds against.
hdb-redb = ["dep:redb"]
# The LDAP form of an entry: attribute names, the mapping to and from Heimdal's
# schema, the Active Directory spellings, and an `Hdb` over a `Directory` the
# embedder supplies. No LDAP client, on purpose: see `src/hdb/ldap.rs`.
hdb-ldap = []
# `kadmind`: MIT's kadm5 protocol over ONC RPC, sealed by RPCSEC_GSS and RFC 4121
# tokens. A front end over `Admin`, not a second implementation of it.
kadmin = []
# SPAKE pre-authentication (RFC 9588). Off by default: it adds a curve implementation and a
# second way to log in, and a realm that has not thought about it should not grow one.
spake = ["dep:curve25519-dalek"]
# OTP pre-authentication (RFC 6560). No dependency: the ASN.1 and the nonce check are this
# crate's, and the one-time value is judged by a `Verifier` the caller supplies.
otp = []
# The JSON form of the administrator's vocabulary, for a transport that speaks
# HTTP. `serde` alone is enough for the domain types (`Principal`, `Enctype`);
# this feature adds the request and reply envelopes and the base64 encoding the
# binary fields need.
serde = ["dep:serde", "dep:base64", "rrl-crypto/serde", "rrl-krb-common/serde"]
# The JSON envelopes. Named separately so that a caller who only wants
# `Principal` to serialize does not get the rest.
admin-json = ["serde"]
# A second, independent implementation of RFC 3961/3962/8009 crypto. Every
# known-answer vector in `tests/` then runs against both, which turns the vectors
# from a self-test into a differential test.
#
# Off by default and secondary on purpose: `krb5` is the client this KDC is
# judged by, because it is tested against a live MIT KDC and is stricter about
# what it accepts. `rskrb5` is a cross-check on the crypto only.
crypto-rskrb5 = ["rrl-crypto/crypto-rskrb5"]
# PKINIT (RFC 4556): certificate parsing, CMS, and the public-key arithmetic the
# exchange needs. Off by default because it pulls in an X.509 stack, which a realm
# that authenticates with passwords never touches.
pkinit = ["dep:x509-parser", "dep:rsa", "dep:num-bigint", "dep:num-traits", "dep:rsa-sha2", "dep:aes", "dep:p256", "dep:p384", "dep:p521"]

# An example that needs a feature is declared with `required-features`, so that a
# default build does not compile it. Without this, `cargo test` builds every example
# and `cargo test` in the primary configuration fails on an example about a feature
# it does not have — which the `--all-features` gate cannot see, because there the
# feature is on.
[[example]]
name = "ad-blob"
required-features = ["hdb-ldap"]

# The PKINIT examples use the X.509 stack, the DH arithmetic and the RSA signer, all of
# which live behind the feature. Without `required-features` a default `cargo test` builds
# them anyway — it builds every example — and fails on the missing modules, which is exactly
# the trap the `ad-blob` entry above was added for.
[[example]]
name = "pkinit-fixture"
required-features = ["pkinit"]

[[example]]
name = "pkinit-reply"
required-features = ["pkinit"]

[dev-dependencies]
# The primary client. Written by a third party and tested against a live MIT KDC,
# it is the half of every acceptance test that matters: it asks this KDC for a
# ticket exactly as MIT's `kinit` would and refuses anything MIT refuses, so a
# reply it accepts is a reply another implementation would accept too.
krb5 = "1.0"
hex = "0.4"
# A test computes the expected CBC value by hand (`D(C) ⊕ IV`) rather than asking the crate under
# test for it, so it needs the cipher itself. That is the point of the test: the definition, not
# our agreement with ourselves.
aes = "0.9"
# The secondary implementation, with the half a *service* needs: the acceptor
# (`service`) lives behind `messages`, which the library never asks for. Cargo
# unifies features per build, so this reaches tests only and leaves
# `cargo build` with the crypto-only dependency.
rskrb5 = { version = "0.2", default-features = false, features = ["messages"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PEM in the PKINIT fixtures: a test should not need openssl at run time.
base64 = "0.22"

[profile.release]
overflow-checks = true
